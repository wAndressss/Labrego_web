    <!-- Pantalla de carga: va aquí (no en React) para verse desde el primer instante -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at 50% 40%, #fffaf0 0%, #f4ecd6 60%, #e9dfc0 100%);
        transition: opacity .6s ease, visibility .6s ease;
      }
      #splash.splash-hide { opacity: 0; visibility: hidden; }
      .splash-seen #splash { display: none; }
      #splash svg { width: min(280px, 64vw); height: auto; overflow: visible; }
      .sp-sun { transform-box: fill-box; transform-origin: center; animation: sp-rise 1.1s cubic-bezier(.2,.8,.2,1) both; }
      .sp-rays { transform-box: view-box; transform-origin: 100px 92px; animation: sp-rays-in .6s ease-out .7s both, sp-spin 14s linear 1.3s infinite; }
      .sp-ray { fill: #f09c3c; }
      .sp-mtn { animation: sp-up .8s cubic-bezier(.2,.8,.2,1) both; }
      .sp-mtn-1 { animation-delay: .15s; } .sp-mtn-2 { animation-delay: .3s; } .sp-mtn-3 { animation-delay: .45s; }
      .sp-word { font: 800 30px/1 'Urbanist', 'Segoe UI', system-ui, sans-serif; letter-spacing: 8px; fill: #2c4014;
        animation: sp-fade .7s ease-out .8s both; }
      .sp-tag { margin: 0; font: 400 19px/1.2 'Kalam', 'Segoe Print', cursive; color: #5d8a2e; animation: sp-fade .7s ease-out 1.05s both; }
      .sp-bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(61,90,31,.15); overflow: hidden; animation: sp-fade .4s ease-out .9s both; }
      .sp-bar span { display: block; height: 100%; width: 40%; border-radius: 4px; background: linear-gradient(90deg, #98bf22, #3d5a1f);
        animation: sp-load 1.1s ease-in-out infinite; }
      @keyframes sp-rise { from { transform: translateY(70px); } to { transform: none; } }
      @keyframes sp-rays-in { from { opacity: 0; scale: .6; } to { opacity: 1; scale: 1; } }
      @keyframes sp-spin { to { rotate: 360deg; } }
      @keyframes sp-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes sp-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes sp-load { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
    <script>
      // Se muestra una vez por sesión: al navegar o recargar después ya no aparece
      try { if (sessionStorage.getItem('labrego-splash')) document.documentElement.classList.add('splash-seen'); } catch (e) {}
    </script>
